name: Configure AWS credentials
description: Authenticate with AWS via OIDC role or access keys

inputs:
  role-arn:
    description: IAM role to assume (preferred)
    required: false
    default: ''
  access-key-id:
    description: AWS access key (used when role-arn is empty)
    required: false
    default: ''
  secret-access-key:
    description: AWS secret key
    required: false
    default: ''
  region:
    description: AWS region
    required: true

runs:
  using: composite
  steps:
    - name: Verify AWS credentials are configured
      shell: bash
      run: |
        if [[ -z "${{ inputs.role-arn }}" && -z "${{ inputs.access-key-id }}" ]]; then
          echo "::error::No AWS credentials configured. On GitHub Environment 'development', set either:" >&2
          echo "  - Secret AWS_ROLE_ARN (OIDC role for Terraform), or" >&2
          echo "  - Secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY" >&2
          exit 1
        fi
        if [[ -z "${{ inputs.role-arn }}" && -n "${{ inputs.access-key-id }}" && -z "${{ inputs.secret-access-key }}" ]]; then
          echo "::error::AWS_ACCESS_KEY_ID is set but AWS_SECRET_ACCESS_KEY is missing on the development environment." >&2
          exit 1
        fi

    - name: Configure AWS credentials (OIDC)
      if: ${{ inputs.role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.region }}

    - name: Configure AWS credentials (access keys)
      if: ${{ inputs.role-arn == '' && inputs.access-key-id != '' }}
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.access-key-id }}
        aws-secret-access-key: ${{ inputs.secret-access-key }}
        aws-region: ${{ inputs.region }}

# Standalone workflow when api/ is its own git repository.
# Monorepo: use /.github/workflows/deploy-api.yml instead.
#
# GitHub environments: development → AWS (SSM), production → VPS (SSH)
name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!infra/**'
      - '!.github/workflows/terraform-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: development = AWS, production = VPS
        required: true
        type: choice
        options: [development, production]
        default: development
      pull_env_from_s3:
        description: Pull API .env from S3 before release
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'development' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.DEPLOY_ENVIRONMENT || 'development' }}
    env:
      GH_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.DEPLOY_ENVIRONMENT || 'development' }}
      PULL_ENV_FROM_S3: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_env_from_s3 || github.event_name != 'workflow_dispatch' && vars.LOAD_ENV_FROM_S3 == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy target
        id: target
        env:
          OVERRIDE: ${{ vars.DEPLOY_TARGET }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            TARGET="$OVERRIDE"
          elif [[ "$GH_ENV" == "development" ]]; then
            TARGET="aws"
          elif [[ "$GH_ENV" == "production" ]]; then
            TARGET="vps"
          else
            echo "Use development (AWS) or production (VPS)." >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Configure AWS
        if: ${{ steps.target.outputs.target == 'aws' || env.PULL_ENV_FROM_S3 == 'true' }}
        uses: ./.github/actions/configure-aws
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, pdo_mysql, tokenizer

      - run: composer validate --no-check-publish
      - run: chmod +x scripts/*.sh

      - name: Deploy over SSM
        if: ${{ steps.target.outputs.target == 'aws' }}
        uses: ./.github/actions/ssm-deploy
        with:
          instance-id: ${{ vars.AWS_EC2_INSTANCE_ID }}
          region: ${{ vars.AWS_REGION || 'us-east-1' }}
          s3-bucket: ${{ vars.AWS_DEPLOY_S3_BUCKET }}
          s3-prefix: deploys/api
          local-path: .
          remote-path: ${{ vars.AWS_EC2_PATH || '/var/www/api' }}
          exclude-from: scripts/rsync-excludes.txt
          remote-command: |
            set -euo pipefail
            cd '${{ vars.AWS_EC2_PATH || '/var/www/api' }}'
            chmod +x scripts/*.sh
            LOAD_ENV_FROM_S3=false bash scripts/remote-release.sh
            supervisorctl restart bells-sis-queue bells-sis-scheduler || true

      - name: Deploy over SSH
        if: ${{ steps.target.outputs.target == 'vps' }}
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ vars.VPS_HOST }}
          user: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || '22' }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY || secrets.VPS_SSH_KEY }}
          remote-path: ${{ vars.VPS_API_PATH || vars.VPS_PATH }}
          local-path: .
          exclude-from: scripts/rsync-excludes.txt
          remote-command: |
            set -euo pipefail
            cd '${{ vars.VPS_API_PATH || vars.VPS_PATH }}'
            chmod +x scripts/*.sh
            LOAD_ENV_FROM_S3=false bash scripts/remote-release.sh

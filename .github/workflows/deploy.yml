# Standalone workflow when api/ is its own git repository.
# Monorepo: use /.github/workflows/deploy-api.yml instead.
#
# GitHub environments: development → AWS (SSM), production → VPS (SSH)
name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!infra/**'
      - '!.github/workflows/terraform-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: development = AWS, production = VPS
        required: true
        type: choice
        options: [development, production]
        default: development
      pull_env_from_s3:
        description: Unused for AWS. Env overlay always comes from secrets ENV_S3_BUCKET + ENV_S3_KEY (object KEY/.env).
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'development' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.DEPLOY_ENVIRONMENT || 'development' }}
    env:
      GH_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.DEPLOY_ENVIRONMENT || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy target
        id: target
        env:
          OVERRIDE: ${{ vars.DEPLOY_TARGET }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            TARGET="$OVERRIDE"
          elif [[ "$GH_ENV" == "development" ]]; then
            TARGET="aws"
          elif [[ "$GH_ENV" == "production" ]]; then
            TARGET="vps"
          else
            echo "Use development (AWS) or production (VPS)." >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Configure AWS
        uses: ./.github/actions/configure-aws
        with:
          role-arn: ${{ secrets.AWS_ROLE_ARN }}
          access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Resolve deploy bucket
        id: bucket
        if: ${{ steps.target.outputs.target == 'aws' }}
        env:
          FROM_VARS: ${{ vars.AWS_DEPLOY_S3_BUCKET }}
          FROM_SECRETS: ${{ secrets.AWS_DEPLOY_S3_BUCKET }}
          PROJECT: ${{ vars.PROJECT_NAME || 'bells-sis' }}
        run: |
          set -euo pipefail
          BUCKET="${FROM_VARS:-}"
          SOURCE="vars"
          if [[ -z "$BUCKET" && -n "${AWS_DEPLOY_S3_BUCKET:-}" ]]; then
            BUCKET="$AWS_DEPLOY_S3_BUCKET"
            SOURCE="runner-env"
          fi
          if [[ -z "$BUCKET" && -n "${FROM_SECRETS:-}" ]]; then
            BUCKET="$FROM_SECRETS"
            SOURCE="secret"
          fi
          if [[ -z "$BUCKET" ]]; then
            ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
            BUCKET="${PROJECT}-bootstrap-${ACCOUNT}"
            SOURCE="account-default"
          fi
          echo "Using deploy bucket s3://${BUCKET}/ (source=${SOURCE})"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Resolve EC2 instance
        id: instance
        if: ${{ steps.target.outputs.target == 'aws' }}
        env:
          FROM_VARS: ${{ vars.AWS_EC2_INSTANCE_ID }}
          FROM_SECRETS: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          GH_ENV: ${{ env.GH_ENV }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          valid_id() { [[ "$1" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]; }
          ID="${FROM_VARS:-${AWS_EC2_INSTANCE_ID:-${FROM_SECRETS:-}}}"
          ID="$(echo "$ID" | tr -d '[:space:]')"
          if ! valid_id "$ID"; then
            ID="$(aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=instance-state-name,Values=running,pending" "Name=tag:Name,Values=*bells-sis-api" \
              --query "Reservations[].Instances[].InstanceId | [0]" --output text)"
            ID="$(echo "$ID" | tr -d '[:space:]')"
          fi
          if ! valid_id "$ID"; then
            echo "Set AWS_EC2_INSTANCE_ID (terraform output api_instance_id)." >&2
            exit 1
          fi
          echo "Using EC2 instance ${ID}"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Download env overlay from S3
        id: env-s3
        env:
          SECRET_BUCKET: ${{ secrets.ENV_S3_BUCKET }}
          SECRET_KEY: ${{ secrets.ENV_S3_KEY }}
          VAR_BUCKET: ${{ vars.ENV_S3_BUCKET }}
          VAR_KEY: ${{ vars.ENV_S3_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          BUCKET="${SECRET_BUCKET:-${VAR_BUCKET:-}}"
          KEY="${SECRET_KEY:-${VAR_KEY:-}}"
          BUCKET="${BUCKET#"${BUCKET%%[![:space:]]*}"}"
          BUCKET="${BUCKET%"${BUCKET##*[![:space:]]}"}"
          KEY="${KEY#"${KEY%%[![:space:]]*}"}"
          KEY="${KEY%"${KEY##*[![:space:]]}"}"
          KEY="${KEY#/}"
          KEY="${KEY%/}"
          if [[ -z "$BUCKET" || -z "$KEY" ]]; then
            echo "Set GitHub environment secrets ENV_S3_BUCKET and ENV_S3_KEY (object is \$ENV_S3_BUCKET/\$ENV_S3_KEY/.env)." >&2
            exit 1
          fi
          if [[ ! "${KEY,,}" =~ \.env$ ]]; then
            KEY="${KEY}/.env"
          fi
          FILE="${RUNNER_TEMP}/api.env"
          echo "Downloading env overlay from S3 (ENV_S3_BUCKET/ENV_S3_KEY/.env)."
          aws s3 cp "s3://${BUCKET}/${KEY}" "$FILE" --region "$AWS_REGION" --only-show-errors
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "pull=true" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, pdo_mysql, tokenizer

      - run: composer validate --no-check-publish
      - run: chmod +x scripts/*.sh

      - name: Deploy over SSM
        if: ${{ steps.target.outputs.target == 'aws' }}
        uses: ./.github/actions/ssm-deploy
        with:
          instance-id: ${{ steps.instance.outputs.id }}
          region: ${{ vars.AWS_REGION || 'us-east-1' }}
          s3-bucket: ${{ steps.bucket.outputs.bucket }}
          s3-prefix: deploys/api
          local-path: .
          remote-path: ${{ vars.AWS_EC2_PATH || '/var/www/api' }}
          exclude-from: scripts/rsync-excludes.txt
          env-file: ${{ steps.env-s3.outputs.file }}
          remote-command: |
            set -euo pipefail
            cd '${{ vars.AWS_EC2_PATH || '/var/www/api' }}'
            chmod +x scripts/*.sh
            export LOAD_ENV_FROM_S3=false
            bash scripts/remote-release.sh
            supervisorctl restart bells-sis-queue bells-sis-scheduler || true

      - name: Deploy over SSH
        if: ${{ steps.target.outputs.target == 'vps' }}
        uses: ./.github/actions/ssh-deploy
        with:
          host: ${{ vars.VPS_HOST }}
          user: ${{ vars.VPS_USER }}
          port: ${{ vars.VPS_PORT || '22' }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY || secrets.VPS_SSH_KEY }}
          remote-path: ${{ vars.VPS_API_PATH || vars.VPS_PATH }}
          local-path: .
          exclude-from: scripts/rsync-excludes.txt
          env-file: ${{ steps.env-s3.outputs.file }}
          remote-command: |
            set -euo pipefail
            cd '${{ vars.VPS_API_PATH || vars.VPS_PATH }}'
            chmod +x scripts/*.sh
            export LOAD_ENV_FROM_S3=false
            bash scripts/remote-release.sh

; Bells SIS — Supervisor (admissions VPS: 8 GB / 120 GB SSD).
; Install: /etc/supervisor/conf.d/bells-sis.conf
; Then: sudo supervisorctl reread && sudo supervisorctl update
;
; Use either this scheduler program OR deploy/setup-scheduler.sh (systemd timer), not both.
; Set QUEUE_CONNECTION=redis in .env when Redis is enabled; keep --queue default.

[program:bells-sis-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php -d memory_limit=512M /var/www/bells-sis/api/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/bells-sis/queue.log
stopwaitsecs=3600

[program:bells-sis-scheduler]
command=/usr/bin/php /var/www/bells-sis/api/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/bells-sis/scheduler.log

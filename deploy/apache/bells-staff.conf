# Staff SPA — Vite dist/ (public/.htaccess is copied into dist on build)
# Copy to /etc/apache2/sites-available/bells-staff.conf
<VirtualHost *:80>
    ServerName staff.example.com
    ServerAlias www.staff.example.com
    DocumentRoot /var/www/bells-sis/staff

    <Directory /var/www/bells-sis/staff>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bells-staff-error.log
    CustomLog ${APACHE_LOG_DIR}/bells-staff-access.log combined
</VirtualHost>

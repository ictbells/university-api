# Student SPA — own hostname requires VITE_BASE=/ on the production build
# Copy to /etc/apache2/sites-available/bells-student.conf
<VirtualHost *:80>
    ServerName student.example.com
    ServerAlias www.student.example.com
    DocumentRoot /var/www/bells-sis/student

    <Directory /var/www/bells-sis/student>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bells-student-error.log
    CustomLog ${APACHE_LOG_DIR}/bells-student-access.log combined
</VirtualHost>

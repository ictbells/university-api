# Bells SIS API — DocumentRoot must be Laravel public/
# Copy to /etc/apache2/sites-available/bells-api.conf and replace example.com
# Enable HTTP first so certbot can issue; then: certbot --apache -d api.example.com
<VirtualHost *:80>
    ServerName api.example.com
    DocumentRoot /var/www/bells-sis/api/public

    <Directory /var/www/bells-sis/api/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/bells-api-error.log
    CustomLog ${APACHE_LOG_DIR}/bells-api-access.log combined
</VirtualHost>
